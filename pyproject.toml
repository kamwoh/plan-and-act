[project]
name = "plan-and-act"
version = "0.1.0"
description = "An LLM controls a simulated robot arm in MuJoCo"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
armmind = "armmind.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx2", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/armmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "assets: needs the Panda model (run scripts/fetch_assets.sh)",
  "objects: needs the scanned objects (run scripts/fetch_objects.sh)",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
