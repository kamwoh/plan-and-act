<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arm-mind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>arm-mind</h1><span id="status" aria-live="polite">idle</span><span id="totals" class="muted"></span></header>
  <main>
    <section class="views">
      <figure>
        <div class="frame"><span>Loading scene…</span><img id="live" alt="Front camera, live" hidden></div>
        <figcaption>Front camera (live, or the starting scene)</figcaption>
      </figure>
      <figure>
        <div class="frame"><span>Loading scene…</span><img id="top" alt="Top camera with grid, live" hidden></div>
        <figcaption>Top camera with grid (live)</figcaption>
      </figure>
    </section>
    <section class="panel controls">
      <form id="run">
        <label>Examples <select id="examples"><option value="">Write your own…</option></select></label>
        <label>Instruction <textarea id="instruction" rows="3" maxlength="500" required></textarea></label>
        <p id="mode" class="muted"></p>
        <div class="row">
          <label>Seed <input id="seed" type="number" value="0" min="0"></label>
          <label>Max steps <input id="max_steps" type="number" value="30" min="1" max="200"></label>
        </div>
        <label class="check"><input id="show_positions" type="checkbox"> Debug: give cube positions to the model</label>
        <div class="buttons"><button type="submit">Start</button><button type="button" id="stop">Stop</button><button type="button" id="prompt_btn">Prompt <small id="prompt_tag">default</small></button></div>
      </form>
    </section>
    <section class="panel log">
      <div class="memo">
        <div><h2>To-do</h2><ul id="todo"></ul></div>
        <div><h2>Notes</h2><p id="notes"></p></div>
      </div>
      <h2>Steps</h2>
      <ul id="steps"></ul>
    </section>
  </main>
  <dialog id="step_dialog" aria-labelledby="step_title">
    <div class="dlg-head"><h2 id="step_title">Step</h2><button type="button" id="step_close">Close</button></div>
    <div id="step_body" class="dlg-body"></div>
  </dialog>
  <dialog id="prompt_dialog" aria-labelledby="prompt_title">
    <div class="dlg-head"><h2 id="prompt_title">System prompt</h2><button type="button" id="prompt_close">Close</button></div>
    <div class="dlg-body">
      <textarea id="prompt_text" rows="14" maxlength="10000" spellcheck="false" aria-label="System prompt"></textarea>
      <div class="buttons"><button type="button" id="prompt_save">Save</button><button type="button" id="prompt_reset">Reset to default</button><span id="prompt_msg" class="muted"></span></div>
      <p class="muted">The reply format is fixed by a JSON schema, so a prompt edit cannot break parsing.</p>
      <h2>Example step message (filled in by code each step)</h2>
      <pre id="prompt_example"></pre>
    </div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
